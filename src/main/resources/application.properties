spring.application.name=task-saas
server.port=8080

# Local settings and secrets live in .env (gitignored). See .env.example.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS (comma-separated origins allowed to call the API from a browser)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.level.org.springframework.security=INFO
